# Universe Configuration
# Phase 2.5: Expanded Multi-Sector Research Universe (~36 Liquid US Equities + ETFs)

universe:
  name: "us_liquid_multisector_v2_5"
  description: "Cross-sectional research universe spanning 8 sectors and major index ETFs"
  
  benchmarks:
    broad_market: "SPY"
    tech_growth: "QQQ"
    small_cap: "IWM"


hypothesis:
  target_profile: "3_TRADING_DAYS_RELATIVE_REVERSAL"
  core_mechanism: "Cross-sectional mean reversion following multi-day idiosyncratic overextension"
  holding_period_days: 3
  rebalance_frequency: "DAILY_CLOSE"
  signal_generation_cutoff: "16:05_EST"
  execution_policy: "NEXT_SESSION_OPEN_OR_VWAP"

features:
  - name: "reversal_3d"
    formula: "-1.0 * (close / shift(close, 3) - 1.0)"
    description: "Inverted 3-day cumulative return"
  - name: "reversal_5d"
    formula: "-1.0 * (close / shift(close, 5) - 1.0)"
    description: "Inverted 5-day cumulative return"
  - name: "rel_strength_3d"
    formula: "return_3d(symbol) - return_3d(universe_equal_weight)"
    description: "3-day relative strength difference"
  - name: "overnight_gap"
    formula: "(open - shift(close, 1)) / shift(close, 1)"
    description: "Overnight opening gap return"


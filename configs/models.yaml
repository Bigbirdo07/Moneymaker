# Models & Feature Pipeline Configuration

features:
  returns:
    lookback_bars: [1, 3, 6, 12]
  momentum:
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ema_periods: [9, 21, 50]
    sma_periods: [20, 50, 200]
  volatility:
    atr_period: 14
    rolling_std_period: 20
    realized_vol_period: 24
  volume:
    relative_volume_period: 20
    volume_zscore_period: 20
  targets:
    forward_return_bars: [3, 6, 12, 18] # 15m, 30m, 60m, 90m for 5m bars
    classification_threshold_pct: 0.005  # +/- 0.50%

baselines:
  random:
    seed: 42
  momentum:
    fast_ema: 9
    slow_ema: 21
    rsi_threshold: 55.0
    stop_loss_pct: 0.005
    take_profit_pct: 0.010
    max_holding_bars: 12 # 60 minutes
  mean_reversion:
    bb_period: 20
    bb_std: 2.0
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    stop_loss_pct: 0.005
    take_profit_pct: 0.008
    max_holding_bars: 12 # 60 minutes

# Deterministic Risk Policy Configuration

risk:
  portfolio:
    initial_capital: 1000.0
    max_position_pct: 0.10             # Max 10% of portfolio in a single asset ($100 on $1k)
    max_risk_per_trade_pct: 0.01       # Max 1% of portfolio risked per trade ($10)
    max_daily_loss_pct: 0.03           # Hard circuit breaker: halt trading on 3% daily loss
    max_portfolio_drawdown_pct: 0.15   # Max 15% peak-to-trough portfolio drawdown limit
    max_sector_exposure_pct: 0.25      # Max 25% of portfolio in any single sector
    max_concurrent_positions: 5        # Max open positions simultaneously

  constraints:
    leverage_allowed: false
    shorting_allowed: false
    options_allowed: false
    overnight_holding_allowed: false   # Intraday only in V1

  veto_rules:
    check_buying_power: true
    check_daily_drawdown_limit: true
    check_max_concurrent_positions: true
    check_sector_concentration: true
    check_correlation_concentration: true
